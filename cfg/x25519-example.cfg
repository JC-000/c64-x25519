# x25519-example.cfg — STARTER ld65 linker config for downstream consumers
#
# This is a reasonable starting point for a project that links against
# libx25519.a. It is NOT prescriptive — adapt the memory map to your
# application's needs. The key constraints the library imposes are:
#
#   1. A LIB_X25519_CODE segment for library code (v0.8+, issue #70:
#      SPEC §4 prefix migration — the library no longer emits into the
#      plain CODE segment). Your own code can use whatever segment
#      names you like (plain CODE included, as below).
#   2. A LIB_X25519_DATA segment with `align = 256` (page alignment).
#      The library's data.s uses .align 256 to guarantee 32-byte field
#      buffers land at offsets $00/$20/$40/$60/$80/$A0/$C0/$E0 within
#      a page, which is required by the self-modifying abs,Y
#      addressing in fe25519_add / fe25519_sub / fe25519_reduce_final.
#      The align = 256 is a CT invariant (hard-asserted in data.s),
#      not a perf hint. The segment's type MUST also stay
#      file-emitting (`rw`) in a file-backed area: `type = bss` links
#      with only a WARNING, silently drops the library's tables,
#      constants, and buffers (~3.7 KB) from the PRG, and shifts every
#      file-emitting segment declared after this one ~3.7 KB below its
#      linked address (SPEC v0.8.3 mid-area displacement).
#   3. A SQTAB region reserving 1024 bytes for the runtime-built
#      quarter-square multiply tables (see mul_8x8.s). Default address
#      is $7800 (the c64-lib-contract §8.1 LIB_SHARED_SQTAB_BASE
#      default); override by passing `ca65 -D
#      LIB_SHARED_SQTAB_BASE=0x<addr>` when rebuilding the library
#      from source, and update the SQTAB MEMORY block below to match.
#      WARNING — this pairing is enforced by NOTHING at link time: no
#      source emits into the SQTAB segment (sqtab_lo/hi are equates
#      off LIB_SHARED_SQTAB_BASE), so a cfg whose region disagrees
#      with the -D value links clean and sqtab_init then writes 1 KB
#      at the EQUATE address over whatever lives there. Keep the two
#      in lockstep by hand.
#   4. A ZEROPAGE region — the library owns $14-$2E and $40-$7F while
#      running; see src/x25519.inc for the full map.
#   5. A LIB_X25519_INIT_CODE segment declaration (v0.8+, issue #68).
#      This is NOT optional for your cfg: the library archive emits the
#      segment, and ld65 hard-errors on any input segment without a
#      memory-area assignment. It holds init-only code (sqtab_init,
#      reu_mul_init, reu_probe); after your boot sequence has called
#      the init entry points, you MAY reuse its RAM — the window is
#      exactly [__LIB_X25519_INIT_CODE_LOAD__,
#      __LIB_X25519_INIT_CODE_LOAD__ + __LIB_X25519_INIT_CODE_SIZE__)
#      via define = yes (nominally LIB_X25519_COLD_BYTES; smaller in
#      SHARED_* deferral builds). Declare it as the LAST FILE-EMITTING
#      segment in MAIN, BEFORE any bss-type segment — ld65 emits no
#      file bytes for bss, so file-backed code declared after a
#      non-empty BSS loads shifted and corrupts silently. Init entry
#      points must never be re-called after reclaim. Reclaiming never
#      touches the §8.3 ct_mul_8x8 shared body — that stays in the
#      resident LIB_X25519_CODE segment precisely so owner-mode
#      composition keeps working.
#
# This example builds a traditional BASIC-stub PRG that loads at $0801
# and enters at $0810 (SYS 2064). For a non-BASIC or relocatable
# downstream project, adjust LOADADDR/MAIN/BASICSTUB accordingly.

FEATURES {
    STARTADDRESS: default = $0801;
}

SYMBOLS {
    __LOADADDR__: type = import;

    # sqtab_lo / sqtab_hi were linker-exported here pre-v0.6 / pre-§8.
    # They are now source-level `.ifndef`-guarded equates in
    # src/constants.s, derived from LIB_SHARED_SQTAB_BASE (default
    # $7800). Override by rebuilding the library with
    # `ca65 -D LIB_SHARED_SQTAB_BASE=0x<addr>` (apply the
    # same flag to every .s -> .o invocation). Update the SQTAB
    # MEMORY block below to match.
}

MEMORY {
    ZP:       file = "",  start = $0002, size = $00FD, define = yes;
    LOADADDR: file = %O,  start = %S - 2, size = $0002;
    MAIN:     file = %O,  start = %S,     size = $7800 - %S, define = yes;
    SQTAB:    file = "",  start = $7800,  size = $0400, define = yes;
}

SEGMENTS {
    ZEROPAGE:  load = ZP,       type = zp,  optional = yes;
    LOADADDR:  load = LOADADDR, type = ro;
    BASICSTUB: load = MAIN,     type = ro,  optional = yes;
    # Your own (consumer) code — any segment name works; plain CODE
    # shown here.
    CODE:      load = MAIN,     type = rw;

    # Library hot code (issue #70, SPEC §4 prefix). See constraint 1.
    LIB_X25519_CODE: load = MAIN, type = rw;

    RODATA:    load = MAIN,     type = ro,  optional = yes;

    # Library data — align = 256 is a CT invariant, and type = rw is
    # load-bearing too: type = bss here links with only a WARNING and
    # silently drops ~3.7 KB of initialized tables/buffers from the
    # PRG. See constraint 2.
    LIB_X25519_DATA: load = MAIN, type = rw, optional = yes, align = 256;

    # Your own (consumer) mutable data, if any.
    DATA:      load = MAIN,     type = rw,  optional = yes, align = 256;

    # Init-only library code (issue #68). MUST be the last FILE-EMITTING
    # segment in MAIN, and MUST come before bss-type segments: ld65
    # writes no file bytes for bss, so a file-backed segment declared
    # after a non-empty BSS loads __BSS_SIZE__ bytes below its linked
    # address — silent corruption with no link error. See constraint 5
    # in the header.
    LIB_X25519_INIT_CODE: load = MAIN, type = rw, optional = yes, define = yes;

    BSS:       load = MAIN,     type = bss, optional = yes, define = yes;

    SQTAB:     load = SQTAB,    type = bss, optional = yes, define = yes;
}

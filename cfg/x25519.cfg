# x25519.cfg — ca65/ld65 linker configuration for the C64 X25519 implementation
#
# Memory layout mirrors the existing ACME build:
#   $0801       BASIC stub (SYS 2064)
#   $080D       Code entry area (start label at $0810)
#   $7800-$7BFF Quarter-square lookup tables (runtime-built by sqtab_init,
#               referenced by hardcoded addresses in mul_8x8.asm:11-12)
#
# PRG file has a 2-byte load address header ($01 $08) prepended by the
# LOADADDR segment, matching the stock c64-asm.cfg pattern.

FEATURES {
    STARTADDRESS: default = $0801;
}

SYMBOLS {
    __LOADADDR__: type = import;

    # As of v0.6 + c64-lib-contract §8.1 adoption, sqtab_lo / sqtab_hi
    # are source-level `.ifndef`-guarded equates in src/constants.s
    # (default $7800 / $7A00; override via
    # `ca65 --asm-define LIB_SHARED_SQTAB_BASE=$N`). They are NO
    # longer linker-exported here. The SQTAB MEMORY entry below
    # remains as a default-address reservation for the standalone
    # `make` build; consumers that override the base must supply
    # their own cfg with a matching reservation.
}

MEMORY {
    # Zero page: $02-$FE. ZP usage is defined via constants in source,
    # not via linker allocation — but ld65 needs the region for the
    # ZEROPAGE segment type.
    ZP:       file = "",  start = $0002, size = $00FD, define = yes;

    # 2-byte PRG load address header (written to file before MAIN)
    LOADADDR: file = %O,  start = %S - 2, size = $0002;

    # Main memory: BASIC stub + code + rodata + data, up to just before
    # the quarter-square tables at $7800.
    MAIN:     file = %O,  start = %S,     size = $7800 - %S, define = yes;

    # Quarter-square tables: sqtab_lo at $7800 (256 B), sqtab_hi at
    # $7A00 (256 B). Total reserved region is $0400. These are built at
    # runtime by sqtab_init; the linker just reserves the address space
    # so nothing else lands here. Type bss => no bytes in PRG.
    SQTAB:    file = "",  start = $7800,  size = $0400, define = yes;
}

SEGMENTS {
    # ZP segment for any zero-page labels (optional; we mostly use constants)
    ZEROPAGE:  load = ZP,       type = zp,  optional = yes;

    # 2-byte load address ($01 $08)
    LOADADDR:  load = LOADADDR, type = ro;

    # 12-byte BASIC SYS 2064 stub at $0801
    BASICSTUB: load = MAIN,     type = ro;

    # Harness/consumer code (entry point start: at $0810). The library
    # itself no longer emits into CODE (issue #70, SPEC §4) — this
    # entry holds main.s (the test harness) and keeps the start=$0810
    # pad immediately after BASICSTUB (SYS 2064 invariant).
    CODE:      load = MAIN,     type = rw;

    # Library hot code (issue #70, SPEC §4 prefix): fe25519, x25519,
    # runtime REU helpers, mul_8x8's resident §8.3 body, util.
    LIB_X25519_CODE: load = MAIN, type = rw;

    # Harness/consumer read-only data. The library emits NO RODATA —
    # its lookup tables (mul38_*, sqr_*, a24_*, DMA staging) live in
    # LIB_X25519_DATA via src/data.s. Kept as an optional placeholder
    # for downstream code.
    RODATA:    load = MAIN,     type = ro,  optional = yes;

    # Library data (issue #70, SPEC §4 prefix): page-aligned 32-byte
    # field buffers (fe_tmp*, x25_*, fe_p, etc.) and other mutable
    # library data. The align = 256 is CT-LOAD-BEARING, not a perf
    # hint: data.s uses .align 256 + hard asserts to guarantee each
    # 32-byte field buffer starts at $00/$20/.../$E0 within a page so
    # ,y-indexed access never crosses a page boundary. type = rw is
    # also load-bearing: the segment holds initialized bytes (fe_p,
    # basepoint, mul38/sqr/a24 tables), so type = bss links with only
    # a warning and silently drops them from the PRG.
    LIB_X25519_DATA: load = MAIN, type = rw, optional = yes, align = 256;

    # Harness/consumer mutable data. Nothing in-tree emits DATA after
    # the issue-#70 rename (data.s moved to LIB_X25519_DATA), but the
    # entry stays for downstream consumers' own code.
    DATA:      load = MAIN,     type = rw,  optional = yes, align = 256;

    # Init-only code (issue #68 cold-segment split, SPEC §4 name):
    # sqtab_init, reu_mul_init, reu_probe. Declared as the LAST
    # file-emitting segment in MAIN — it MUST come before the bss-type
    # BSS entry below: ld65 writes no file bytes for bss segments, so a
    # file-backed segment declared after a non-empty BSS loads
    # __BSS_SIZE__ bytes below its linked address (silent corruption,
    # no link error). define = yes exports
    # __LIB_X25519_INIT_CODE_LOAD__ / _SIZE__ — the reclaim window is
    # exactly [__LOAD__, __LOAD__ + __SIZE__). optional because
    # SHARED_SQTAB_INIT + SHARED_REU_MUL_INIT deferral builds can empty
    # it. In the standalone build nothing is reclaimed — the segment
    # loads and runs in place like any other code.
    LIB_X25519_INIT_CODE: load = MAIN, type = rw, optional = yes, define = yes;

    # Uninitialised data. bss-type segments MUST stay last in the
    # file-backed MAIN area (see note above).
    BSS:       load = MAIN,     type = bss, optional = yes, define = yes;

    # Quarter-square table reservation ($7800). No file output.
    SQTAB:     load = SQTAB,    type = bss, optional = yes, define = yes;
}
